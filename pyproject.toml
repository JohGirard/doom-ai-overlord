[project]
name = "doom-ai-overlord"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "laya>=0.3.4",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "vizdoom>=1.3.1",
]

# CUDA-enabled torch wheels (RTX 3060, driver CUDA 13.x -> cu126 builds)
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[dependency-groups]
ui = []
